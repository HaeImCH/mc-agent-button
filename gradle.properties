# Increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Build + run on the brew-installed Temurin JDK 25. The game bytecode still targets
# Java 21 (see build.gradle `options.release = 21`); this only sets the JVM that runs
# the Gradle daemon and the dev client. Comment this out to use JAVA_HOME instead.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home

# Fabric versions — verified against meta.fabricmc.net + modrinth on 2026-06-20.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
loom_version=1.17.11

# Fabric API
fabric_version=0.141.4+1.21.11

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=agentbutton
