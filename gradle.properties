# Increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Build + run on the brew-installed Temurin JDK 25 (Minecraft 26.x requires Java 25).
# Comment this out to use JAVA_HOME instead.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home

# Fabric versions — verified against meta.fabricmc.net + modrinth on 2026-10-14.
# 26.x ships unobfuscated, so there are no Yarn mappings: code uses Mojang's names.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4

# Fabric API
fabric_version=0.163.0+26.3

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=agentbutton
